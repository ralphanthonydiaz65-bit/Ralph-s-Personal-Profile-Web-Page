<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Profile Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="navbar">
    <div class="logo">MyProfile</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    
    
    <section id="about" class="card profile-section">
      <img src="me.jfif" alt="Profile Picture" class="profile-img">
      <div class="profile-bio">
        <h1>Ralph Anthony A. Diaz</h1>
        <h2>ICT Student</h2>
        <p>Welcome to my profile website!</p>
      </div>
      <div class="clear"></div>
    </section>

    
    <section id="skills" class="card">
      <h2>Skills & Interests</h2>
      <ul class="styled-list">
        <li><a >i love to watch Anime</a></li>
        <li><a >i know how to play volleyball</a></li>
        <li><a >i know how to dance</a></li>
      </ul>
    </section>

   
    <section id="contact" class="card">
      <h2>Contact Me</h2>
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 My Personal Profile Website. All rights reserved.</p>
  </footer>

</body>
</html>
